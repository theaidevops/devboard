name: CI 

on: 
  push:
    branches: [master]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-patch: frontent/package-lock.json
        
      - name: Install npm Packages
        run: npm install
        working-directory: frontend 

      - name: Run Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Test 
        run: run test
        working-directory: frontend




   

