name: CI 

on: 
  push:
    branches: [master]

jobs:
  Frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Nodejs
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
        
      - name: Install npm Packages
        run: npm install --legacy-peer-deps
        working-directory: frontend 

      - name: Run Linter
        run: npm run lint
        working-directory: frontend

      - name: Run Test 
        run: npm run test
        working-directory: frontend
  
  Backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          go-version-file: 'go.mo'
          cache-dependency-path: go.sum
        
      - name: Run Go Formatter
        run: go fmt
        working-directory: backend

      - name: Run Go Vet
        run: go vet
        working-directory: backend

      - name: Run Test 
        run: go test
        working-directory: backend





   

